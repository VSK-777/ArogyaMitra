spring.application.name=hospital-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.demo-mode=${DEMO_MODE}
groq.api.key=${GROQ_API_KEY}
spring.threads.virtual.enabled=true

msg91.authkey=${MSG91_AUTHKEY}
msg91.template-id=${MSG91_TEMPLATE_ID}

server.port=${PORT:8080}
