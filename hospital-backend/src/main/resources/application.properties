spring.application.name=hospital-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.demo-mode=${DEMO_MODE}
groq.api.key=${GROQ_API_KEY}
spring.threads.virtual.enabled=true

msg91.authkey=${MSG91_AUTHKEY}
msg91.whatsapp.number=${MSG91_WHATSAPP_NUMBER:}
msg91.whatsapp.template.name=${MSG91_WHATSAPP_TEMPLATE_NAME:}
msg91.whatsapp.template.language=${MSG91_WHATSAPP_TEMPLATE_LANGUAGE:en_US}
msg91.whatsapp.namespace=${MSG91_WHATSAPP_NAMESPACE:}

app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

server.port=${PORT:8080}
