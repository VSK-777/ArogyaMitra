spring.application.name=hospital-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.demo-mode=${DEMO_MODE}
groq.api.key=${GROQ_API_KEY}
spring.threads.virtual.enabled=true


server.port=${PORT:8080}

# Cloudflare R2 Storage Configurations
cloudflare.r2.enabled=true
cloudflare.r2.accountId=${CLOUDFLARE_ACCOUNT_ID}
cloudflare.r2.accessKey=${CLOUDFLARE_ACCESS_KEY}
cloudflare.r2.secretKey=${CLOUDFLARE_SECRET_KEY}
cloudflare.r2.bucket=${CLOUDFLARE_BUCKET_NAME}
